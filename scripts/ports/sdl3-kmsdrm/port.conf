# shellcheck shell=bash disable=SC2034
# SDL3 shared library with the KMSDRM video backend, as a drop-in for
# bundled libSDL3.so.0 in prebuilt apps (KOReader ships SDL3 without
# KMSDRM, so it cannot open the handheld's display). Keep the version equal
# to the bundled one: KOReader v2026.07.1 bundles release-3.4.12.
# Build only: this port has no launcher, so deploy-port.sh does not apply.

SRC_DIR="../SDL3"

BIN_NAME="libSDL3.so.0"
BIN_PATHS=(libSDL3.so.0)

REMOTE_SUBDIR="sdl3-kmsdrm"
LAUNCHER_NAME="none"

CMAKE_ARGS=(
  -DSDL_SHARED=ON -DSDL_STATIC=OFF
  -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_INSTALL=OFF
  # No X11/Wayland on the handheld: KMSDRM only (needs gbm/drm/EGL devel).
  -DSDL_KMSDRM=ON -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_VULKAN=OFF
  -DSDL_UNIX_CONSOLE_BUILD=ON
  -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
)

PREPARE_DEPS=''

# shellcheck shell=bash disable=SC2034
# taiko: native TJA (Taiko chart) player for the handheld. Source lives in
# this repo under apps/taiko. Songs are not part of the port: sync them to
# /storage/roms/homebrew/taiko/songs (see apps/taiko/README.md).

SRC_DIR="apps/taiko"

BIN_NAME="taiko"
BIN_PATHS=(taiko)

# Homebrew menu: app folder + a top-level launcher + a gamelist entry.
MENU="homebrew"
REMOTE_SUBDIR="taiko"
LAUNCHER_NAME="Taiko.sh"
LAUNCHER_IN_MENU=1
GAME_NAME="Taiko"
GAME_DESC="TJA chart player. Menu: D-pad select, A play, Calibration entry. In game: A/B/D-pad: don, X/Y/L1/R1: ka, L2/R2: offset -/+5 ms, SELECT+START: back."
GAME_AUTHOR="rg351v"

CMAKE_ARGS=()

# Pre-seed the SDL3 checkout the CMakeLists points at (idempotent).
PREPARE_DEPS='
if [[ -f /deps/sdl3/CMakeLists.txt ]]; then
  echo "SDL3 already seeded"
else
  rm -rf /deps/sdl3
  git clone --depth 1 --branch release-3.4.12 https://github.com/libsdl-org/SDL.git /deps/sdl3
fi'

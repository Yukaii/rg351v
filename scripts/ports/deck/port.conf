# shellcheck shell=bash disable=SC2034
# deck: Spotify player UI for the handheld. A remote control for deckd
# (apps/deckd); source lives in this repo under apps/deck. Reuses ptterm's
# Unifont asset (see apps/ptterm/tools/gen-assets.py).

SRC_DIR="apps/deck"

BIN_NAME="deck"
BIN_PATHS=(deck)

# Homebrew menu: app folder + a top-level launcher + a gamelist entry.
MENU="homebrew"
REMOTE_SUBDIR="deck"
LAUNCHER_NAME="Spotify.sh"
LAUNCHER_IN_MENU=1
GAME_NAME="Spotify"
GAME_DESC="Spotify player (needs deckd). A: play/pause, L1/R1: prev/next, D-pad: seek/volume, X: shuffle, Y: repeat, SELECT+START: leave. Music keeps playing when you leave."
GAME_AUTHOR="rg351v"
# Shared with ptterm: .storage/ptterm-data/unifont.bin
EXTRA_DIR="ptterm-data"
EXTRA_FILES=(unifont.bin)

CMAKE_ARGS=()

# Pre-seed the SDL3 checkout the CMakeLists points at (idempotent).
PREPARE_DEPS='
if [[ -f /deps/sdl3/CMakeLists.txt ]]; then
  echo "SDL3 already seeded"
else
  rm -rf /deps/sdl3
  git clone --depth 1 --branch release-3.4.12 https://github.com/libsdl-org/SDL.git /deps/sdl3
fi'

# shellcheck shell=bash disable=SC2034
# taiko-probe: audio/input latency probe (phase 0 of the TJA player). Source
# lives in this repo under apps/taiko.

SRC_DIR="apps/taiko"

BIN_NAME="taiko-probe"
BIN_PATHS=(taiko-probe)

# Homebrew menu: app folder + a top-level launcher + a gamelist entry.
MENU="homebrew"
REMOTE_SUBDIR="taiko-probe"
LAUNCHER_NAME="TaikoProbe.sh"
LAUNCHER_IN_MENU=1
GAME_NAME="Taiko Probe"
GAME_DESC="Audio/input latency probe. A: click, B: metronome, D-pad up/down: buffer size, X: reset, SELECT+START: leave."
GAME_AUTHOR="rg351v"

CMAKE_ARGS=()

# Pre-seed the SDL3 checkout the CMakeLists points at (idempotent).
PREPARE_DEPS='
if [[ -f /deps/sdl3/CMakeLists.txt ]]; then
  echo "SDL3 already seeded"
else
  rm -rf /deps/sdl3
  git clone --depth 1 --branch release-3.4.12 https://github.com/libsdl-org/SDL.git /deps/sdl3
fi'

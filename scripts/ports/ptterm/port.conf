# shellcheck shell=bash disable=SC2034
# ptterm: Big5 BBS terminal (PTT) for the handheld. Source lives in this repo
# under apps/ptterm; assets come from apps/ptterm/tools/gen-assets.py.

SRC_DIR="apps/ptterm"

BIN_NAME="ptterm"
BIN_PATHS=(ptterm)

# Homebrew menu: app folder + a top-level launcher + a gamelist entry.
MENU="homebrew"
REMOTE_SUBDIR="ptterm"
LAUNCHER_NAME="PTT.sh"
LAUNCHER_IN_MENU=1
GAME_NAME="PTT Terminal"
GAME_DESC="SSH terminal for ptt.cc (Big5, 80x24). A: Enter, B: back, X: space, Y: guest login, L1/R1: page up/down, L2/R2: top/end."
GAME_AUTHOR="rg351v"
# Extra files from .storage/ptterm-data/ installed next to the binary
# (generate with apps/ptterm/tools/gen-assets.py, see README).
EXTRA_DIR="ptterm-data"
EXTRA_FILES=(unifont.bin big5uao.bin)

CMAKE_ARGS=()

# Pre-seed the SDL3 checkout the CMakeLists points at (idempotent).
PREPARE_DEPS='
if [[ -f /deps/sdl3/CMakeLists.txt ]]; then
  echo "SDL3 already seeded"
else
  rm -rf /deps/sdl3
  git clone --depth 1 --branch release-3.4.12 https://github.com/libsdl-org/SDL.git /deps/sdl3
fi'

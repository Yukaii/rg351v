# shellcheck shell=bash disable=SC2034
# Template port definition. Copy this directory to scripts/ports/<name>/ and
# fill it in; <name> becomes the argument to build-port.sh / deploy-port.sh.

# Game source checkout (CMake project), relative to the repo root
# (override with PORT_SRC).
SRC_DIR="../CHANGEME"

# Binary name and where it lands in the build tree (relative to /build,
# first match wins).
BIN_NAME="CHANGEME"
BIN_PATHS=(CHANGEME "src/CHANGEME")

# Install location: /storage/roms/ports/<REMOTE_SUBDIR>/, launcher shows up
# in the Ports menu under LAUNCHER_NAME.
REMOTE_SUBDIR="CHANGEME"
LAUNCHER_NAME="CHANGEME.sh"

# Extra cmake arguments (Ninja + Release are always set).
CMAKE_ARGS=(
  -DSDL_UNIX_CONSOLE_BUILD=ON
  -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
)

# Optional shell snippet run in the container (deps volume on /deps) before
# configuring, for things CMake cannot fetch itself. Must be idempotent.
PREPARE_DEPS=''

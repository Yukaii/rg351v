# shellcheck shell=bash disable=SC2034
# Port definition for pikaball-revamped (Pikachu Volleyball). Sourced by
# scripts/build-port.sh and scripts/deploy-port.sh.

# Game source checkout, relative to the repo root (override with PORT_SRC).
SRC_DIR="../pikachu-valleyball-ios"

# Binary name and where it lands in the build tree (relative to /build,
# first match wins).
BIN_NAME="pikaball_revamped"
BIN_PATHS=(src/pikaball_revamped pikaball_revamped)

# Install location: /storage/roms/ports/<REMOTE_SUBDIR>/, launcher shows up
# in the Ports menu under LAUNCHER_NAME.
REMOTE_SUBDIR="pikaball"
LAUNCHER_NAME="PikachuVolleyball.sh"

# Extra cmake arguments (Ninja + Release are always set).
CMAKE_ARGS=(
  # No X11/Wayland on the handheld: console (KMSDRM/evdev) build.
  -DSDL_UNIX_CONSOLE_BUILD=ON
  # SDL_ttf's tarball lacks its external/ submodules; use the pre-seeded
  # checkout from prepare_deps.
  -DFETCHCONTENT_SOURCE_DIR_SDL_TTF=/deps/sdl_ttf
  # Static libstdc++/libgcc: the device's system ones may be older.
  -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
)

# Shell snippet run inside the container (with the <name>-deps volume on
# /deps) before configuring. Must be idempotent.
PREPARE_DEPS='
if [[ -f /deps/sdl_ttf/CMakeLists.txt && -f /deps/sdl_ttf/external/harfbuzz/CMakeLists.txt ]]; then
  echo "SDL_ttf already seeded"
else
  rm -rf /deps/sdl_ttf
  git clone --depth 1 https://github.com/libsdl-org/SDL_ttf.git /deps/sdl_ttf
  (cd /deps/sdl_ttf && ./external/download.sh)
fi'
